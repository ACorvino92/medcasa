<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f766e"><title>MedCasa</title>
<style>*{box-sizing:border-box}body{margin:0;font:16px system-ui,-apple-system,sans-serif;background:#f2f7f6;color:#173d35}header{background:#0f766e;color:#fff;padding:22px}header h1{margin:0}main{max-width:760px;margin:auto;padding:16px}.card{background:#fff;padding:18px;margin:12px 0;border-radius:15px;box-shadow:0 2px 12px #173d3512}input,button{font:inherit;border-radius:9px;padding:11px;border:1px solid #b8cec8}input{display:block;width:100%;margin:5px 0 14px}button{background:#0f766e;color:#fff;border:0;cursor:pointer}button:disabled{opacity:.4}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:#667c76;font-size:14px}.hidden{display:none}.lot{border-top:1px solid #e1ece8;padding:10px 0}.lot button{padding:7px 12px}.stats{font-weight:600}#status{white-space:pre-wrap;color:#9a3c31}</style></head>
<body><header><h1>MedCasa</h1>Farmacia domestica condivisa</header><main><p id="status" role="status"></p>
<section id="auth" class="card"><h2>Accedi</h2><p class="muted">Usa le credenziali dell'utente registrato in Supabase Authentication.</p><form id="login"><label>Email<input id="email" type="email" autocomplete="email" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Accedi</button></form></section>
<section id="app" class="hidden"><div class="row"><span class="muted" id="who"></span><button id="logout">Esci</button></div><div class="card"><div class="row"><h2>Inventario</h2><button id="reload">Aggiorna</button></div><p class="stats" id="stats"></p><input id="search" placeholder="Cerca un medicinale" aria-label="Cerca"><div id="items"></div></div>
<div class="card"><h2>Aggiungi medicinale</h2><form id="add"><label>Nome<input id="name" required></label><label>Scadenza (mese e anno)<input id="expiry" type="month" required></label><label>Confezioni<input id="qty" type="number" min="1" step="1" value="1" required></label><button>Aggiungi</button></form></div><p class="muted">Una scadenza indicata come mese/anno vale fino alla fine del mese. Verifica sempre la confezione.</p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const db=window.supabase.createClient('https://squevujkaqmjqwwuqpcj.supabase.co','sb_publishable_p50JQ-ozE1wwfz6l3Cendw_TT1W3Wig');
const $=id=>document.getElementById(id);let home=null,meds=[],lots=[],channel=null;
function say(s){$('status').textContent=s||''}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function isExpired(d){let [y,m]=d.slice(0,7).split('-').map(Number),now=new Date();return y<now.getFullYear()||(y===now.getFullYear()&&m<now.getMonth()+1)}
async function load(){const r=await db.from('memberships').select('household_id').limit(1);if(r.error)throw r.error;if(!r.data?.length){home=null;meds=[];lots=[];render();say('Account non associato a una famiglia MedCasa.');return}
home=r.data[0].household_id;const a=await db.from('medicines').select('id,name').eq('household_id',home).order('name');if(a.error)throw a.error;meds=a.data||[];
const b=await db.from('lots').select('id,medicine_id,expiry_month,quantity');if(b.error)throw b.error;lots=(b.data||[]).filter(l=>meds.some(m=>m.id===l.medicine_id));render()}
function render(){let q=$('search').value.toLocaleLowerCase('it');$('stats').textContent=meds.length+' medicinali · '+lots.reduce((s,l)=>s+l.quantity,0)+' confezioni · '+lots.filter(l=>l.quantity>0&&isExpired(l.expiry_month)).reduce((s,l)=>s+l.quantity,0)+' scadute';$('items').innerHTML='';
for(let m of meds.filter(m=>m.name.toLocaleLowerCase('it').includes(q))){let own=lots.filter(l=>l.medicine_id===m.id),el=document.createElement('article');el.className='card';el.style.border='1px solid #e4eeeb';el.style.boxShadow='none';el.innerHTML='<div class="row"><b>'+esc(m.name)+'</b><span>'+own.reduce((s,l)=>s+l.quantity,0)+'</span></div>'+own.map(l=>'<div class="row lot"><span style="color:'+(isExpired(l.expiry_month)?'#a13b31':'inherit')+'">Scad. '+esc(l.expiry_month.slice(5,7)+'/'+l.expiry_month.slice(0,4))+'</span><span><button data-id="'+l.id+'" data-d="-1">−</button> '+l.quantity+' <button data-id="'+l.id+'" data-d="1">+</button></span></div>').join('');$('items').append(el)}}
$('login').onsubmit=async e=>{e.preventDefault();say('Accesso in corso...');let r=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)say(r.error.message)};
$('logout').onclick=()=>db.auth.signOut();$('reload').onclick=()=>load().then(()=>say('Dati aggiornati')).catch(e=>say(e.message));$('search').oninput=render;
$('add').onsubmit=async e=>{e.preventDefault();try{if(!home)throw Error('Famiglia non associata');let name=$('name').value.trim(),month=$('expiry').value,qty=Number($('qty').value);if(!name||!month||!Number.isInteger(qty)||qty<1)throw Error('Controlla i dati');let m=meds.find(m=>m.name.toLocaleLowerCase('it')===name.toLocaleLowerCase('it'));if(!m){let r=await db.from('medicines').insert({household_id:home,name}).select('id,name').single();if(r.error)throw r.error;m=r.data}let r=await db.from('lots').insert({medicine_id:m.id,expiry_month:month+'-01',quantity:qty});if(r.error)throw r.error;$('add').reset();await load();say('Confezioni aggiunte')}catch(e){say(e.message)}};
$('items').onclick=async e=>{let btn=e.target.closest('button[data-id]');if(!btn)return;let l=lots.find(x=>x.id===btn.dataset.id),delta=Number(btn.dataset.d);if(!l||l.quantity+delta<0)return;btn.disabled=true;try{let r=await db.from('lots').update({quantity:l.quantity+delta}).eq('id',l.id).eq('quantity',l.quantity).select('id');if(r.error)throw r.error;if(!r.data.length)say('Un altro utente ha modificato la quantità: dati aggiornati.');await load()}catch(e){say(e.message)}};
db.auth.onAuthStateChange((_event,session)=>{let user=session?.user;$('auth').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);$('who').textContent=user?.email||'';if(user){setTimeout(()=>load().catch(e=>say(e.message)),0)}else{home=null;meds=[];lots=[];say('')}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&home)load().catch(e=>say(e.message))});setInterval(()=>{if(home&&!document.hidden)load().catch(()=>{})},30000);
</script></body></html>
